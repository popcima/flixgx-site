<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--accent:#e50000;--text:#ffffff;--muted:rgba(255,255,255,0.55);--border:rgba(255,255,255,0.12);--glass:rgba(14,14,14,0.88);--liquid-surface:rgba(255,255,255,.055);--liquid-surface-strong:rgba(255,255,255,.085);--liquid-border:rgba(255,255,255,.16);--liquid-highlight:rgba(255,255,255,.32);--radius:10px}
html{scroll-behavior:smooth;background:#030405}
body{background:radial-gradient(ellipse 74% 38% at 50% -10%,rgba(255,255,255,.145),transparent 68%),radial-gradient(ellipse 56% 38% at 88% 8%,rgba(229,0,0,.13),transparent 64%),radial-gradient(ellipse 54% 32% at 10% 82%,rgba(135,168,220,.085),transparent 62%),linear-gradient(180deg,#050608 0%,#08090c 46%,#030304 100%);background-attachment:fixed;color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
svg{display:inline-block;vertical-align:middle}

/* NAV */
.nav-wrap{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100;width:280px;max-width:calc(100vw - 20px)}
@media(max-width:640px){.nav-wrap{top:auto;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom))}}
.nav-bar{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;height:64px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.055) 38%,rgba(255,255,255,.035) 100%),rgba(7,8,10,.54);border:1px solid rgba(255,255,255,.22);border-radius:32px;padding:0 24px;backdrop-filter:blur(26px) saturate(1.55) contrast(1.05);-webkit-backdrop-filter:blur(26px) saturate(1.55) contrast(1.05);box-shadow:0 14px 30px rgba(0,0,0,.42),0 2px 8px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.07)}
.nav-bar::before,.nav-bar::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.nav-bar::before{inset:1px 1px auto;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.075) 62%,transparent);opacity:.78}
.nav-bar::after{inset:1px;background:radial-gradient(ellipse 110% 70% at 50% -12%,rgba(255,255,255,.2),transparent 58%),radial-gradient(ellipse 90% 70% at 50% 125%,rgba(255,255,255,.09),transparent 62%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);opacity:.86}
.nav-pill{display:none}
.nav-link{position:relative;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:0;text-decoration:none;flex-shrink:0;z-index:1;transition:color .16s,transform .16s;color:rgba(247,249,252,.72);border:none;background:none;cursor:pointer;font-family:inherit}
.nav-link::before{content:'';position:absolute;inset:-7px;z-index:0;border-radius:999px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);opacity:0;transform:scale(.86);transition:opacity .16s,transform .16s}
.nav-link.active{color:rgba(255,255,255,.86)}
.nav-link.active::before{opacity:.26;transform:scale(1)}
.nav-link:not(.active):hover,.nav-link.active:hover{color:rgba(255,255,255,.96)}
.nav-link:hover::before{opacity:.34;transform:scale(1)}
.nav-link svg{width:24px;height:24px;position:relative;z-index:1;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
@media(max-width:430px){.nav-wrap{width:280px}.nav-bar{height:60px;border-radius:30px;padding:0 22px}.nav-link,.nav-link svg{width:23px;height:23px}}

/* SEARCH HERO */
.search-hero{min-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:108px 32px 40px;position:relative}
.search-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 40%,color-mix(in srgb,var(--accent) 8%,transparent) 0%,transparent 70%);pointer-events:none}

.search-eyebrow{font-size:10px;font-weight:900;color:var(--accent);letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px;text-align:center}

.search-box-wrap{width:100%;max-width:660px;position:relative}

.search-input-row{position:relative;display:flex;align-items:center}

.search-icon{position:absolute;left:20px;z-index:2;color:var(--muted);transition:color .2s;pointer-events:none}
.search-icon svg{width:20px;height:20px}
.search-input-row:focus-within .search-icon{color:var(--accent)}

.search-input{width:100%;height:60px;border-radius:16px;border:1.5px solid var(--liquid-border);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),rgba(7,8,10,.5);backdrop-filter:blur(24px) saturate(1.45);-webkit-backdrop-filter:blur(24px) saturate(1.45);color:var(--text);font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;padding:0 56px 0 56px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:0 16px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.search-input:focus{border-color:color-mix(in srgb,var(--accent) 48%,rgba(255,255,255,.42));background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.035)),rgba(7,8,10,.56);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent),0 18px 44px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.18)}
.search-input::placeholder{color:rgba(255,255,255,.28);font-weight:400}

.search-clear{position:absolute;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .15s;z-index:2}
.search-clear.visible{display:flex}
.search-clear:hover{background:rgba(255,255,255,.15);color:var(--text)}
.search-clear svg{width:14px;height:14px}

/* FILTER TABS */
.filter-tabs{display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:center}
.filter-tab{padding:7px 18px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--liquid-border);background:var(--liquid-surface);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.filter-tab:hover{border-color:rgba(255,255,255,.28);color:var(--text)}
.filter-tab.active{background:var(--text);border-color:var(--text);color:var(--bg)}

/* MAIN CONTENT */
.main{padding:0 36px 100px;max-width:1440px;margin:0 auto}

/* EMPTY STATE (trending + recent) */
.empty-section{margin-bottom:40px}
.empty-section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.empty-section-bar{width:3px;height:18px;border-radius:2px;background:var(--accent);flex-shrink:0}
.empty-section-title{font-size:16px;font-weight:700;color:var(--text)}

.trending-chips{display:flex;flex-wrap:wrap;gap:8px}
.trend-chip{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--liquid-border);background:var(--liquid-surface);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;text-decoration:none}
.trend-chip:hover{border-color:rgba(255,255,255,.25);color:var(--text);background:rgba(255,255,255,.08)}
.trend-chip-num{font-size:10px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;min-width:14px}

.recent-list{display:flex;flex-direction:column;gap:2px}
.recent-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.recent-item:hover{background:var(--liquid-surface)}
.recent-item svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.recent-item-text{flex:1;font-size:14px;color:var(--text)}
.recent-item-del{width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.recent-item-del:hover{background:rgba(255,255,255,.1);color:var(--text)}
.recent-item-del svg{width:13px;height:13px}

/* TRENDING GRID (for empty state) */
.section{margin-bottom:40px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title-group{display:flex;align-items:center;gap:10px}
.section-accent-bar{width:3px;height:18px;border-radius:2px;background:var(--accent);flex-shrink:0}
.section-title{font-size:16px;font-weight:700;color:var(--text)}

.card-row{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-behavior:smooth}
.card-row::-webkit-scrollbar{display:none}
.card-row{-ms-overflow-style:none;scrollbar-width:none}

/* RESULTS AREA */
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.results-title{font-size:14px;color:var(--muted)}
.results-title strong{color:var(--text)}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}

/* CARD (shared) */
.movie-card{width:100%;cursor:pointer;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.movie-card:hover{transform:translateY(-5px)}
.card-thumb{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.035)),rgba(255,255,255,.045);border:1px solid var(--liquid-border);box-shadow:0 18px 38px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35)}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:filter .5s;filter:grayscale(30%) contrast(1.04);display:block}
.movie-card:hover .card-thumb img{filter:grayscale(0) contrast(1)}
.card-hover-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 70%);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.movie-card:hover .card-hover-overlay{opacity:1}
.card-play-btn{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 16px rgba(0,0,0,.6);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.movie-card:hover .card-play-btn{transform:scale(1.1)}
.card-play-btn svg{width:13px;height:13px;fill:#000;margin-left:2px;display:block}
.card-rating{position:absolute;top:8px;left:8px;background:rgba(10,10,10,.82);backdrop-filter:blur(8px);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--text);z-index:2}
.card-media-badge{position:absolute;top:8px;right:8px;padding:2px 6px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;background:rgba(10,10,10,.78);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);z-index:2}
.card-info{padding:8px 2px 0}
.card-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-year{font-size:12px;color:var(--muted);margin-top:2px}

/* CARD for horizontal row (same as index) */
.card-row .movie-card{flex-shrink:0;width:148px}
.card-row .card-thumb{width:148px;height:222px}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* NO RESULTS */
.no-results{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;gap:14px}
.no-results-icon{width:56px;height:56px;border-radius:16px;background:var(--liquid-surface);border:1px solid var(--liquid-border);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);display:flex;align-items:center;justify-content:center;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.no-results-icon svg{width:24px;height:24px;color:var(--muted)}
.no-results-title{font-size:18px;font-weight:700;color:var(--text)}
.no-results-sub{font-size:14px;color:var(--muted);max-width:300px}

/* STAGGER ANIM */
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.results-grid .movie-card{opacity:0;animation:cardIn .35s ease forwards}

/* FOOTER */
footer{padding:36px 36px 40px;border-top:1px solid var(--liquid-border);display:flex;align-items:flex-start;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-top:40px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),rgba(4,5,7,.62);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.footer-left{max-width:300px}
.footer-logo{display:flex;align-items:center;gap:8px;margin-bottom:12px;text-decoration:none}
.footer-logo-text{font-size:14px;font-weight:900;color:var(--text);letter-spacing:.06em}
.footer-tagline{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.footer-desc{font-size:13px;color:var(--muted);line-height:1.65}
.footer-desc a{color:rgba(255,255,255,.65);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2)}
.footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.footer-links{display:flex;gap:22px}
.footer-links a{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
.footer-links a:hover{color:var(--text)}
.dmca-badge{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.dmca-badge svg{width:13px;height:13px}
.footer-copy{font-size:12px;color:rgba(255,255,255,.25)}

</style>

    </button>
    <button id="stream-cast" class="stream-icon-button" type="button" aria-label="Cast to a screen" title="Cast to a screen" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7V5a2 2 0 0 1 2-2h15a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5M2 11a10 10 0 0 1 10 10M2 16a5 5 0 0 1 5 5"/><circle cx="2" cy="21" r="1" fill="currentColor" stroke="none"/></svg></button>
  </header>
  <div id="stream-episodes-menu" class="stream-menu stream-episodes-menu" role="region" aria-label="Seasons and episodes" hidden>
    <h3>Seasons &amp; episodes</h3>

  <div id="stream-message" class="stream-message" hidden>
    <p id="stream-status" role="status" aria-live="polite"></p>
    <button id="stream-retry" class="stream-action" type="button" hidden>Retry playback</button>
    <button id="stream-start" class="stream-action" type="button" hidden>Play video</button>
  </div>
  <div id="stream-announcement" class="stream-sr-only" role="status" aria-live="polite"></div>
  <div id="stream-subtitle-menu" class="stream-menu" role="region" aria-label="Subtitle settings" hidden>
    <h3>Subtitles</h3>
    <label for="stream-subtitles">Language</label>
    <select id="stream-subtitles" disabled><option value="-1">Off</option></select>
    <p id="stream-subtitle-status" class="stream-note"></p>
    <a id="stream-download" hidden>Download subtitles</a>
  </div>
  <div id="stream-settings-menu" class="stream-menu" role="region" aria-label="Playback settings" hidden>
    <h3>Playback settings</h3>
    <label for="stream-quality">Quality</label>
    <select id="stream-quality" disabled><option value="-1">Auto</option></select>
    <label for="stream-audio">Audio</label>
    <select id="stream-audio" disabled><option value="0">Default</option></select>
    <label for="stream-speed">Playback speed</label>
    <select id="stream-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
  </div>
  <div class="stream-bottom stream-chrome">
    <div class="stream-seek-wrap">
      <div class="stream-timeline" aria-hidden="true"><div id="stream-buffered"></div><div id="stream-played"></div></div>
      <input id="stream-seek" class="stream-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek video" disabled>
    </div>
    <div class="stream-control-row">
      <div class="stream-control-left">
        <button id="stream-play" class="stream-icon-button" type="button" aria-label="Play" title="Play" aria-keyshortcuts="Space K"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="stream-play-symbol" d="m8 4 12 8-12 8Z" fill="currentColor" stroke="none"/><g class="stream-pause-symbol" fill="currentColor" stroke="none"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></g></svg></button>
        <button id="stream-backward" class="stream-icon-button" type="button" aria-label="Back 10 seconds" title="Back 10 seconds" ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4 5 7l3 2M5 7a9 9 0 1 1-2 7"/><text x="12.5" y="15.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="8" font-weight="700">10</text></svg></button>
        <button id="stream-forward" class="stream-icon-button" type="button" aria-label="Forward 10 seconds" title="Forward 10 seconds" ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m16 4 3 3-3 2m3-2a9 9 0 1 0 2 7"/><text x="11.5" y="15.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="8" font-weight="700">10</text></svg></button>
        <div class="stream-volume-group">
          <button id="stream-mute" class="stream-icon-button" type="button" aria-label="Mute" title="Mute" aria-keyshortcuts="M"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 4 6 8H3v8h3l5 4Z" fill="currentColor" stroke="none"/><g class="stream-volume-waves"><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></g><path class="stream-muted-symbol" d="m16 9 6 6m0-6-6 6"/></svg></button>
          <input id="stream-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
        <output id="stream-time" class="stream-time" aria-live="off">0:00 / 0:00</output>
      </div>
      <div class="stream-control-right">
        <button id="stream-subtitle-toggle" class="stream-icon-button" type="button" aria-label="Subtitles" title="Subtitles" aria-expanded="false" aria-controls="stream-subtitle-menu"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="4" width="20" height="16" rx="3" fill="currentColor" stroke="none"/><g stroke="#000" stroke-width="1.7"><path d="M6 12h3m3 0h6M6 16h6m3 0h3"/></g></svg></button>
        <button id="stream-settings-toggle" class="stream-icon-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="stream-settings-menu"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9.5 2-.7 2.5-2.1 1.2L4.2 5 2 8.8l1.8 1.8v2.8L2 15.2 4.2 19l2.5-.7 2.1 1.2.7 2.5h5l.7-2.5 2.1-1.2 2.5.7 2.2-3.8-1.8-1.8v-2.8L22 8.8 19.8 5l-2.5.7-2.1-1.2L14.5 2Z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="3.4" fill="#000" stroke="none"/></svg></button>
        <button id="stream-pip" class="stream-icon-button" type="button" aria-label="Picture in picture" title="Picture in picture" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="4" width="20" height="16" rx="3"/><rect x="12" y="12" width="10" height="8" rx="1.5" fill="#000"/><path d="m6 8 4 4m-4 0h4V8"/></svg></button>
        <button id="stream-fullscreen" class="stream-icon-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" aria-keyshortcuts="F"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="stream-enter-fullscreen" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/><path class="stream-exit-fullscreen" d="M3 9h6V3m12 6h-6V3M9 21v-6H3m12 6v-6h6"/></svg></button>
      </div>
    </div>
  </div>

<script>
const API_KEY='76f5b20391ff39408d52881f31d48412',BASE='https://api.themoviedb.org/3',IMG_W='https://image.tmdb.org/t/p/w342',IMG_ORIG='https://image.tmdb.org/t/p/original';
function tmdb(path,params={}){const u=new URL(BASE+path);u.searchParams.set('api_key',API_KEY);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u).then(r=>r.json())}
function rat(v){return v?(+v).toFixed(1):'—'}

// Nav pill
function positionPill(el){
  const pill=document.getElementById('nav-pill'),bar=document.getElementById('nav-bar');
  if(!pill||!bar||!el)return;
  const elR=el.getBoundingClientRect(),barR=bar.getBoundingClientRect();
  pill.style.left=(elR.left-barR.left)+'px';pill.style.width=elR.width+'px';
}
positionPill(document.getElementById('nav-search'));

// Recent searches (localStorage)
const RECENT_KEY='noirx_recent';
function getRecent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch{return[]}}
function addRecent(q){if(!q.trim())return;let r=getRecent().filter(s=>s!==q);r.unshift(q);r=r.slice(0,8);try{localStorage.setItem(RECENT_KEY,JSON.stringify(r))}catch{}}
function delRecent(q){try{localStorage.setItem(RECENT_KEY,JSON.stringify(getRecent().filter(s=>s!==q)))}catch{}}

// State
let curTab='all',debTimer=null;

function setTab(btn,tab){
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');curTab=tab;
  const q=document.getElementById('search-input').value.trim();
  if(q)doSearch(q);
}

// Animated placeholder cycling
const placeholders=['Search movies, shows, actors…','Try "Breaking Bad"…','Try "The Dark Knight"…','Try "Inception"…','Try "Game of Thrones"…','Try "Interstellar"…'];
let phIdx=0;
function cyclePlaceholder(){
  const inp=document.getElementById('search-input');
  if(document.activeElement===inp||inp.value)return;
  phIdx=(phIdx+1)%placeholders.length;
  inp.setAttribute('placeholder',placeholders[phIdx]);
}
setInterval(cyclePlaceholder,3200);

function clearSearch(){
  const inp=document.getElementById('search-input');
  inp.value='';
  document.getElementById('search-clear').classList.remove('visible');
  inp.focus();
  showEmptyState();
}

document.getElementById('search-input').addEventListener('input',function(){
  const q=this.value.trim();
  document.getElementById('search-clear').classList.toggle('visible',q.length>0);
  clearTimeout(debTimer);
  if(!q){showEmptyState();return}
  debTimer=setTimeout(()=>doSearch(q),320);
});

document.getElementById('search-input').addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!document.getElementById('fp-overlay').classList.contains('open')){clearSearch()}
});

// Immediately focus search on load
window.addEventListener('load',()=>document.getElementById('search-input').focus());

// EMPTY STATE
async function showEmptyState(){
  const main=document.getElementById('main-area');
  const recent=getRecent();
  let html='';

  if(recent.length){
    html+=`<div class="empty-section">
      <div class="empty-section-header"><div class="empty-section-bar"></div><div class="empty-section-title">Recent Searches</div></div>
      <div class="recent-list">
        ${recent.map(q=>`
          <button class="recent-item" onclick="setQuery('${q.replace(/'/g,"\\'")}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
            <span class="recent-item-text">${q}</span>
            <button class="recent-item-del" onclick="event.stopPropagation();delRecent('${q.replace(/'/g,"\\'")}');showEmptyState()" title="Remove">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </button>`).join('')}
      </div>
    </div>`;
  }

  html+=`<div class="section">
    <div class="section-header">
      <div class="section-title-group"><div class="section-accent-bar"></div><h2 class="section-title">Trending Now</h2></div>
    </div>
    <div class="card-row" id="trending-row">
      ${Array.from({length:10},(_,i)=>`
        <div class="movie-card" style="animation-delay:${i*30}ms">
          <div class="card-thumb"><div class="skeleton" style="width:148px;height:222px;border-radius:10px"></div></div>
          <div class="card-info">
            <div class="skeleton" style="height:12px;width:80%;border-radius:4px;margin-top:8px"></div>
            <div class="skeleton" style="height:10px;width:45%;border-radius:4px;margin-top:5px"></div>
          </div>
        </div>`).join('')}
    </div>
  </div>`;

  main.innerHTML=html;

  try{
    const data=await tmdb('/trending/all/week');
    const row=document.getElementById('trending-row');
    if(row&&data.results){
      row.innerHTML=data.results.slice(0,14).map((item,i)=>{
        const poster=item.poster_path?IMG_W+item.poster_path:'';
        const title=item.title||item.name||'Untitled';
        const year=(item.release_date||item.first_air_date||'').slice(0,4);
        const type=item.media_type||'movie';
        const rate=rat(item.vote_average);
        const img=poster?`<img src="${poster}" alt="${title}" loading="lazy">`:`<div style="width:100%;height:100%;background:#222"></div>`;
        return `<div class="movie-card" style="animation-delay:${i*30}ms" onclick="openModal(${item.id},'${type}')">
          <div class="card-thumb">${img}<span class="card-rating">${rate}</span>
            <span class="card-media-badge">${type==='tv'?'TV':'Film'}</span>
            <div class="card-hover-overlay"><div class="card-play-btn"><svg viewBox="0 0 18 18"><path d="M4 2.5C4 1.67 4.9 1.16 5.6 1.6l11 6.5c.67.4.67 1.4 0 1.8l-11 6.5C4.9 16.84 4 16.33 4 15.5V2.5Z" fill="#000"/></svg></div></div>
          </div>
          <div class="card-info"><div class="card-name">${title}</div><div class="card-year">${year}</div></div>
        </div>`;
      }).join('');
    }
  }catch(e){console.error(e)}
}

function setQuery(q){
  const inp=document.getElementById('search-input');
  inp.value=q;
  document.getElementById('search-clear').classList.add('visible');
  doSearch(q);
}

async function doSearch(query){
  if(!query.trim())return;
  addRecent(query);
  const main=document.getElementById('main-area');
  const params={query,include_adult:false,page:1};
  let endpoint='/search/multi';
  if(curTab==='movie')endpoint='/search/movie';
  if(curTab==='tv')endpoint='/search/tv';

  main.innerHTML=`<div style="padding:8px 0 20px"><div class="results-header"><div class="results-title">Searching for <strong>"${query}"</strong>…</div></div>
    <div class="results-grid">
      ${Array.from({length:12},(_,i)=>`
        <div class="movie-card" style="animation-delay:${i*25}ms">
          <div class="card-thumb"><div class="skeleton" style="width:100%;aspect-ratio:2/3;border-radius:10px"></div></div>
          <div class="card-info">
            <div class="skeleton" style="height:12px;width:75%;border-radius:4px;margin-top:8px"></div>
            <div class="skeleton" style="height:10px;width:42%;border-radius:4px;margin-top:5px"></div>
          </div>
        </div>`).join('')}
    </div></div>`;

  try{
    const data=await tmdb(endpoint,params);
    let results=(data.results||[]).filter(r=>r.poster_path&&(r.media_type!=='person'));
    if(curTab==='movie')results=results.map(r=>({...r,media_type:'movie'}));
    if(curTab==='tv')results=results.map(r=>({...r,media_type:'tv'}));

    if(!results.length){
      main.innerHTML=`<div class="no-results">
        <div class="no-results-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15L21 21"/><line x1="10.5" y1="8" x2="10.5" y2="13"/><line x1="8" y1="10.5" x2="13" y2="10.5"/></svg></div>
        <div class="no-results-title">No results for "${query}"</div>
        <div class="no-results-sub">Try adjusting your search or switching between Movies and TV Shows.</div>
      </div>`;
      return;
    }

    const total=data.total_results||results.length;
    main.innerHTML=`<div style="padding:8px 0 20px">
      <div class="results-header">
        <div class="results-title"><strong>${total.toLocaleString()}</strong> results for <strong>"${query}"</strong></div>
      </div>
      <div class="results-grid">${results.slice(0,40).map((item,i)=>{
        const poster=item.poster_path?IMG_W+item.poster_path:'';
        const title=item.title||item.name||'Untitled';
        const year=(item.release_date||item.first_air_date||'').slice(0,4);
        const type=item.media_type||(item.first_air_date!==undefined?'tv':'movie');
        const rate=rat(item.vote_average);
        const img=poster?`<img src="${poster}" alt="${title}" loading="lazy">`:`<div style="width:100%;height:100%;background:#222"></div>`;
        return `<div class="movie-card" style="animation-delay:${i*22}ms" onclick="openModal(${item.id},'${type}')">
          <div class="card-thumb">${img}<span class="card-rating">${rate}</span>
            <span class="card-media-badge">${type==='tv'?'TV':'Film'}</span>
            <div class="card-hover-overlay"><div class="card-play-btn"><svg viewBox="0 0 18 18"><path d="M4 2.5C4 1.67 4.9 1.16 5.6 1.6l11 6.5c.67.4.67 1.4 0 1.8l-11 6.5C4.9 16.84 4 16.33 4 15.5V2.5Z" fill="#000"/></svg></div></div>
          </div>
          <div class="card-info"><div class="card-name">${title}</div><div class="card-year">${year}</div></div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }catch(e){console.error(e)}
}

// MODAL
// Full-screen title details are provided by assets/details.js.
// Initial state
showEmptyState();

</script>

<script src="assets/vendor/hls.min.js"></script>
<script src="assets/player-config.js"></script>
<script src="assets/details.js"></script>
<script type="module" src="assets/player.js"></script>
</body>
</html>
