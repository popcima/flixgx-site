<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — flixgx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--accent:#e50000;--text:#ffffff;--muted:rgba(255,255,255,0.55);--border:rgba(255,255,255,0.12);--glass:rgba(14,14,14,0.88);--liquid-surface:rgba(255,255,255,.055);--liquid-surface-strong:rgba(255,255,255,.085);--liquid-border:rgba(255,255,255,.16);--liquid-highlight:rgba(255,255,255,.32);--radius:10px}
html{scroll-behavior:smooth;background:#030405}
body{background:radial-gradient(ellipse 74% 38% at 50% -10%,rgba(255,255,255,.145),transparent 68%),radial-gradient(ellipse 56% 38% at 88% 8%,rgba(229,0,0,.13),transparent 64%),radial-gradient(ellipse 54% 32% at 10% 82%,rgba(135,168,220,.085),transparent 62%),linear-gradient(180deg,#050608 0%,#08090c 46%,#030304 100%);background-attachment:fixed;color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
svg{display:inline-block;vertical-align:middle}

/* NAV */
.nav-wrap{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100;width:280px;max-width:calc(100vw - 20px)}
@media(max-width:640px){.nav-wrap{top:auto;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom))}}
.nav-bar{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;height:64px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.055) 38%,rgba(255,255,255,.035) 100%),rgba(7,8,10,.54);border:1px solid rgba(255,255,255,.22);border-radius:32px;padding:0 24px;backdrop-filter:blur(26px) saturate(1.55) contrast(1.05);-webkit-backdrop-filter:blur(26px) saturate(1.55) contrast(1.05);box-shadow:0 14px 30px rgba(0,0,0,.42),0 2px 8px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.07)}
.nav-bar::before,.nav-bar::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.nav-bar::before{inset:1px 1px auto;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.075) 62%,transparent);opacity:.78}
.nav-bar::after{inset:1px;background:radial-gradient(ellipse 110% 70% at 50% -12%,rgba(255,255,255,.2),transparent 58%),radial-gradient(ellipse 90% 70% at 50% 125%,rgba(255,255,255,.09),transparent 62%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);opacity:.86}
.nav-pill{display:none}
.nav-link{position:relative;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:0;text-decoration:none;flex-shrink:0;z-index:1;transition:color .16s,transform .16s;color:rgba(247,249,252,.72);border:none;background:none;cursor:pointer;font-family:inherit}
.nav-link::before{content:'';position:absolute;inset:-7px;z-index:0;border-radius:999px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);opacity:0;transform:scale(.86);transition:opacity .16s,transform .16s}
.nav-link.active{color:rgba(255,255,255,.86)}
.nav-link.active::before{opacity:.26;transform:scale(1)}
.nav-link:not(.active):hover,.nav-link.active:hover{color:rgba(255,255,255,.96)}
.nav-link:hover::before{opacity:.34;transform:scale(1)}
.nav-link svg{width:24px;height:24px;position:relative;z-index:1;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
@media(max-width:430px){.nav-wrap{width:280px}.nav-bar{height:60px;border-radius:30px;padding:0 22px}.nav-link,.nav-link svg{width:23px;height:23px}}

/* SEARCH HERO */
.search-hero{min-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:108px 32px 40px;position:relative}
.search-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 40%,color-mix(in srgb,var(--accent) 8%,transparent) 0%,transparent 70%);pointer-events:none}

.search-eyebrow{font-size:10px;font-weight:900;color:var(--accent);letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px;text-align:center}

.search-box-wrap{width:100%;max-width:660px;position:relative}

.search-input-row{position:relative;display:flex;align-items:center}

.search-icon{position:absolute;left:20px;z-index:2;color:var(--muted);transition:color .2s;pointer-events:none}
.search-icon svg{width:20px;height:20px}
.search-input-row:focus-within .search-icon{color:var(--accent)}

.search-input{width:100%;height:60px;border-radius:16px;border:1.5px solid var(--liquid-border);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025)),rgba(7,8,10,.5);backdrop-filter:blur(24px) saturate(1.45);-webkit-backdrop-filter:blur(24px) saturate(1.45);color:var(--text);font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;padding:0 56px 0 56px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:0 16px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.search-input:focus{border-color:color-mix(in srgb,var(--accent) 48%,rgba(255,255,255,.42));background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.035)),rgba(7,8,10,.56);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent),0 18px 44px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.18)}
.search-input::placeholder{color:rgba(255,255,255,.28);font-weight:400}

.search-clear{position:absolute;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .15s;z-index:2}
.search-clear.visible{display:flex}
.search-clear:hover{background:rgba(255,255,255,.15);color:var(--text)}
.search-clear svg{width:14px;height:14px}

/* FILTER TABS */
.filter-tabs{display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:center}
.filter-tab{padding:7px 18px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--liquid-border);background:var(--liquid-surface);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.filter-tab:hover{border-color:rgba(255,255,255,.28);color:var(--text)}
.filter-tab.active{background:var(--text);border-color:var(--text);color:var(--bg)}

/* MAIN CONTENT */
.main{padding:0 36px 100px;max-width:1440px;margin:0 auto}

/* EMPTY STATE (trending + recent) */
.empty-section{margin-bottom:40px}
.empty-section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.empty-section-bar{width:3px;height:18px;border-radius:2px;background:var(--accent);flex-shrink:0}
.empty-section-title{font-size:16px;font-weight:700;color:var(--text)}

.trending-chips{display:flex;flex-wrap:wrap;gap:8px}
.trend-chip{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--liquid-border);background:var(--liquid-surface);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;text-decoration:none}
.trend-chip:hover{border-color:rgba(255,255,255,.25);color:var(--text);background:rgba(255,255,255,.08)}
.trend-chip-num{font-size:10px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;min-width:14px}

.recent-list{display:flex;flex-direction:column;gap:2px}
.recent-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.recent-item:hover{background:var(--liquid-surface)}
.recent-item svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.recent-item-text{flex:1;font-size:14px;color:var(--text)}
.recent-item-del{width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.recent-item-del:hover{background:rgba(255,255,255,.1);color:var(--text)}
.recent-item-del svg{width:13px;height:13px}

/* TRENDING GRID (for empty state) */
.section{margin-bottom:40px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title-group{display:flex;align-items:center;gap:10px}
.section-accent-bar{width:3px;height:18px;border-radius:2px;background:var(--accent);flex-shrink:0}
.section-title{font-size:16px;font-weight:700;color:var(--text)}

.card-row{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-behavior:smooth}
.card-row::-webkit-scrollbar{display:none}
.card-row{-ms-overflow-style:none;scrollbar-width:none}

/* RESULTS AREA */
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.results-title{font-size:14px;color:var(--muted)}
.results-title strong{color:var(--text)}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}

/* CARD (shared) */
.movie-card{width:100%;cursor:pointer;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.movie-card:hover{transform:translateY(-5px)}
.card-thumb{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.035)),rgba(255,255,255,.045);border:1px solid var(--liquid-border);box-shadow:0 18px 38px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35)}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:filter .5s;filter:grayscale(30%) contrast(1.04);display:block}
.movie-card:hover .card-thumb img{filter:grayscale(0) contrast(1)}
.card-hover-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 70%);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.movie-card:hover .card-hover-overlay{opacity:1}
.card-play-btn{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 16px rgba(0,0,0,.6);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.movie-card:hover .card-play-btn{transform:scale(1.1)}
.card-play-btn svg{width:13px;height:13px;fill:#000;margin-left:2px;display:block}
.card-rating{position:absolute;top:8px;left:8px;background:rgba(10,10,10,.82);backdrop-filter:blur(8px);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--text);z-index:2}
.card-media-badge{position:absolute;top:8px;right:8px;padding:2px 6px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;background:rgba(10,10,10,.78);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);z-index:2}
.card-info{padding:8px 2px 0}
.card-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-year{font-size:12px;color:var(--muted);margin-top:2px}

/* CARD for horizontal row (same as index) */
.card-row .movie-card{flex-shrink:0;width:148px}
.card-row .card-thumb{width:148px;height:222px}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* NO RESULTS */
.no-results{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;gap:14px}
.no-results-icon{width:56px;height:56px;border-radius:16px;background:var(--liquid-surface);border:1px solid var(--liquid-border);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);display:flex;align-items:center;justify-content:center;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.no-results-icon svg{width:24px;height:24px;color:var(--muted)}
.no-results-title{font-size:18px;font-weight:700;color:var(--text)}
.no-results-sub{font-size:14px;color:var(--muted);max-width:300px}

/* STAGGER ANIM */
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.results-grid .movie-card{opacity:0;animation:cardIn .35s ease forwards}

/* FOOTER */
footer{padding:36px 36px 40px;border-top:1px solid var(--liquid-border);display:flex;align-items:flex-start;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-top:40px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),rgba(4,5,7,.62);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.footer-left{max-width:300px}
.footer-logo{display:flex;align-items:center;gap:8px;margin-bottom:12px;text-decoration:none}
.footer-logo-text{font-size:14px;font-weight:900;color:var(--text);letter-spacing:.06em}
.footer-tagline{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.footer-desc{font-size:13px;color:var(--muted);line-height:1.65}
.footer-desc a{color:rgba(255,255,255,.65);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2)}
.footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.footer-links{display:flex;gap:22px}
.footer-links a{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
.footer-links a:hover{color:var(--text)}
.dmca-badge{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.dmca-badge svg{width:13px;height:13px}
.footer-copy{font-size:12px;color:rgba(255,255,255,.25)}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .28s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{background:#111;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow:hidden;overflow-y:auto;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 80px rgba(0,0,0,.9);transform:scale(.94) translateY(16px);transition:transform .3s cubic-bezier(.34,1.56,.64,1);scrollbar-width:none}
.modal::-webkit-scrollbar{display:none}
.modal-backdrop.open .modal{transform:scale(1) translateY(0)}
.modal-poster{position:relative;width:100%;aspect-ratio:2/3;background:#1a1a1a;overflow:hidden}
.modal-poster img{width:100%;height:100%;object-fit:cover;display:block}
.modal-poster-grad{position:absolute;inset:0;background:linear-gradient(to top,#111 0%,rgba(17,17,17,.4) 40%,transparent 70%);pointer-events:none}
.modal-rating-badge{position:absolute;top:12px;right:12px;background:rgba(10,10,10,.82);backdrop-filter:blur(10px);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px;z-index:2}
.modal-rating-badge svg{width:12px;height:12px;fill:#fbbf24;flex-shrink:0}
.modal-close{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:background .15s;font-family:inherit}
.modal-close:hover{background:rgba(0,0,0,.85)}
.modal-close svg{width:16px;height:16px}
.modal-play-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.7);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .15s;z-index:5;border:none;font-family:inherit}
.modal-play-center:hover{transform:translate(-50%,-50%) scale(1.1);background:#fff}
.modal-play-center svg{width:22px;height:22px;fill:#111;margin-left:3px}
.modal-type-tag{position:absolute;bottom:16px;left:16px;padding:4px 10px;font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:.15em;border-radius:5px;border:1px solid var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);z-index:2}
.modal-body{padding:4px 20px 24px}
.modal-title{font-size:22px;font-weight:900;color:var(--text);line-height:1.2;margin-bottom:6px;letter-spacing:-.02em}
.modal-meta-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.dot{opacity:.45}
.modal-genres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.modal-genre-chip{padding:4px 10px;font-size:11px;font-weight:600;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.modal-overview{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:20px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal-btn-play{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer;font-family:inherit;transition:filter .15s,transform .15s;text-decoration:none}
.modal-btn-play:hover{filter:brightness(1.12)}
.modal-btn-play:active{transform:scale(.97)}
.modal-btn-play svg{width:13px;height:13px;fill:#fff;flex-shrink:0}
.modal-btn-secondary{display:flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--text);font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.12);cursor:pointer;font-family:inherit;transition:background .15s,transform .15s;flex-shrink:0}
.modal-btn-secondary:hover{background:rgba(255,255,255,.13)}
.modal-btn-secondary svg{width:15px;height:15px}
.modal-loading{display:flex;align-items:center;justify-content:center;height:300px}
.modal-spinner{width:32px;height:32px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-seasons-wrap{padding:0 20px;margin-bottom:4px}
.modal-seasons-label{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal-seasons-label::before{content:'';width:3px;height:18px;background:var(--accent);border-radius:2px;flex-shrink:0}
.modal-season-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.modal-season-tabs::-webkit-scrollbar{display:none}
.modal-season-tab{flex-shrink:0;padding:6px 16px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .18s}
.modal-season-tab:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.modal-season-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-episodes-list{padding:0 20px 24px;display:flex;flex-direction:column;gap:2px;margin-top:12px}
.modal-episode{display:flex;align-items:flex-start;gap:12px;padding:10px;border-radius:10px;cursor:pointer;transition:background .15s;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.modal-episode:hover{background:rgba(255,255,255,.06)}
.modal-ep-thumb{position:relative;width:120px;min-width:120px;height:68px;border-radius:8px;overflow:hidden;background:#222;flex-shrink:0}
.modal-ep-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.modal-ep-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1e1e1e}
.modal-ep-thumb-placeholder svg{width:24px;height:24px;opacity:.3}
.modal-ep-thumb img.ep-thumb-fallback{filter:brightness(.5)}
.modal-ep-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.modal-episode:hover .modal-ep-play-overlay{opacity:1}
.modal-ep-play-overlay svg{width:20px;height:20px;fill:#fff}

.modal-ep-meta{font-size:11px;color:var(--muted);margin-bottom:5px}
.modal-ep-desc{font-size:12px;color:rgba(255,255,255,.38);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* PLAYER */
.fp-overlay{position:fixed;inset:0;z-index:600;background:#000;display:none;flex-direction:column}
.fp-overlay.open{display:flex}
.fp-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.38)}
.fp-grain{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");opacity:.45;pointer-events:none}
.fp-top{position:relative;z-index:10;display:flex;align-items:center;gap:12px;padding:18px 20px 0;background:linear-gradient(to bottom,rgba(0,0,0,.72),transparent)}
.fp-back{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
.fp-back:hover{background:rgba(255,255,255,.2)}
.fp-back svg{width:18px;height:18px}
.fp-top-info{flex:1;min-width:0}
.fp-top-title{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-top-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:1px}
.fp-center{flex:1;position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:44px}
.fp-skip{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;transition:color .15s,transform .15s}
.fp-skip:hover{color:#fff;transform:scale(1.08)}
.fp-skip:active{transform:scale(.92)}
.fp-skip svg{width:34px;height:34px}
.fp-skip span{font-size:10px;font-weight:800;letter-spacing:.04em}
.fp-play-btn{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s;backdrop-filter:blur(10px)}
.fp-play-btn:hover{background:rgba(255,255,255,.28)}
.fp-play-btn:active{transform:scale(.93)}
.fp-play-btn svg{width:30px;height:30px}
.fp-bottom{position:relative;z-index:10;padding:0 20px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.85),transparent)}
.fp-prog-wrap{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;margin-bottom:10px;touch-action:none}
.fp-track{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.fp-buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);border-radius:999px;width:0}
.fp-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px;width:0}
.fp-dot{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);transform:translateX(-50%);top:50%;margin-top:-6.5px;pointer-events:none;left:0;transition:transform .12s}
.fp-prog-wrap:hover .fp-dot{transform:translateX(-50%) scale(1.25)}
.fp-tooltip{position:absolute;bottom:22px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;transform:translateX(-50%);pointer-events:none;white-space:nowrap;display:none}
.fp-prog-wrap:hover .fp-tooltip{display:block}
.fp-row{display:flex;align-items:center;gap:8px}
.fp-time{font-size:12px;font-weight:600;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;min-width:100px}
.fp-spacer{flex:1}
.fp-vol-row{display:flex;align-items:center;gap:6px}
.fp-vol-slider{-webkit-appearance:none;width:0;height:4px;border-radius:999px;background:rgba(255,255,255,.25);outline:none;cursor:pointer;transition:width .22s;overflow:hidden}
.fp-vol-row:hover .fp-vol-slider{width:70px}
.fp-vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.fp-vol-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none}
.fp-icon-btn{width:36px;height:36px;border-radius:8px;background:transparent;border:none;color:rgba(255,255,255,.8);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;font-family:inherit}
.fp-icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.fp-icon-btn svg{width:18px;height:18px}
.fp-fs-icon-in{display:block}
.fp-fs-icon-out{display:none}
:fullscreen .fp-fs-icon-in{display:none}
:fullscreen .fp-fs-icon-out{display:block}
:-webkit-full-screen .fp-fs-icon-in{display:none}
:-webkit-full-screen .fp-fs-icon-out{display:block}
.fp-tap-zone{position:absolute;top:0;bottom:0;width:32%;z-index:6;pointer-events:auto}
.fp-tap-left{left:0}
.fp-tap-right{right:0}
.fp-ripple{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;pointer-events:none}
.fp-ripple.show{opacity:1}
.fp-ripple svg{width:22px;height:22px;fill:#fff}
.fp-ripple span{font-size:10px;font-weight:800;color:#fff;margin-top:3px}
</style>

<script>
const API_KEY='76f5b20391ff39408d52881f31d48412',BASE='https://api.themoviedb.org/3',IMG_W='https://image.tmdb.org/t/p/w342',IMG_ORIG='https://image.tmdb.org/t/p/original';
function tmdb(path,params={}){const u=new URL(BASE+path);u.searchParams.set('api_key',API_KEY);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u).then(r=>r.json())}
function rat(v){return v?(+v).toFixed(1):'—'}

// Nav pill
function positionPill(el){
  const pill=document.getElementById('nav-pill'),bar=document.getElementById('nav-bar');
  if(!pill||!bar||!el)return;
  const elR=el.getBoundingClientRect(),barR=bar.getBoundingClientRect();
  pill.style.left=(elR.left-barR.left)+'px';pill.style.width=elR.width+'px';
}
positionPill(document.getElementById('nav-search'));

// Recent searches (localStorage)
const RECENT_KEY='noirx_recent';
function getRecent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch{return[]}}
function addRecent(q){if(!q.trim())return;let r=getRecent().filter(s=>s!==q);r.unshift(q);r=r.slice(0,8);try{localStorage.setItem(RECENT_KEY,JSON.stringify(r))}catch{}}
function delRecent(q){try{localStorage.setItem(RECENT_KEY,JSON.stringify(getRecent().filter(s=>s!==q)))}catch{}}

// State
let curTab='all',debTimer=null;

function setTab(btn,tab){
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');curTab=tab;
  const q=document.getElementById('search-input').value.trim();
  if(q)doSearch(q);
}

// Animated placeholder cycling
const placeholders=['Search movies, shows, actors…','Try "Breaking Bad"…','Try "The Dark Knight"…','Try "Inception"…','Try "Game of Thrones"…','Try "Interstellar"…'];
let phIdx=0;
function cyclePlaceholder(){
  const inp=document.getElementById('search-input');
  if(document.activeElement===inp||inp.value)return;
  phIdx=(phIdx+1)%placeholders.length;
  inp.setAttribute('placeholder',placeholders[phIdx]);
}
setInterval(cyclePlaceholder,3200);

function clearSearch(){
  const inp=document.getElementById('search-input');
  inp.value='';
  document.getElementById('search-clear').classList.remove('visible');
  inp.focus();
  showEmptyState();
}

document.getElementById('search-input').addEventListener('input',function(){
  const q=this.value.trim();
  document.getElementById('search-clear').classList.toggle('visible',q.length>0);
  clearTimeout(debTimer);
  if(!q){showEmptyState();return}
  debTimer=setTimeout(()=>doSearch(q),320);
});

document.getElementById('search-input').addEventListener('keydown',e=>{
  if(e.key==='Escape'){clearSearch()}
});

// Immediately focus search on load
window.addEventListener('load',()=>document.getElementById('search-input').focus());

// EMPTY STATE
async function showEmptyState(){
  const main=document.getElementById('main-area');
  const recent=getRecent();
  let html='';

  if(recent.length){
    html+=`<div class="empty-section">
      <div class="empty-section-header"><div class="empty-section-bar"></div><div class="empty-section-title">Recent Searches</div></div>
      <div class="recent-list">
        ${recent.map(q=>`
          <button class="recent-item" onclick="setQuery('${q.replace(/'/g,"\\'")}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
            <span class="recent-item-text">${q}</span>
            <button class="recent-item-del" onclick="event.stopPropagation();delRecent('${q.replace(/'/g,"\\'")}');showEmptyState()" title="Remove">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </button>`).join('')}
      </div>
    </div>`;
  }

  html+=`<div class="section">
    <div class="section-header">
      <div class="section-title-group"><div class="section-accent-bar"></div><h2 class="section-title">Trending Now</h2></div>
    </div>
    <div class="card-row" id="trending-row">
      ${Array.from({length:10},(_,i)=>`
        <div class="movie-card" style="animation-delay:${i*30}ms">
          <div class="card-thumb"><div class="skeleton" style="width:148px;height:222px;border-radius:10px"></div></div>
          <div class="card-info">
            <div class="skeleton" style="height:12px;width:80%;border-radius:4px;margin-top:8px"></div>
            <div class="skeleton" style="height:10px;width:45%;border-radius:4px;margin-top:5px"></div>
          </div>
        </div>`).join('')}
    </div>
  </div>`;

  main.innerHTML=html;

  try{
    const data=await tmdb('/trending/all/week');
    const row=document.getElementById('trending-row');
    if(row&&data.results){
      row.innerHTML=data.results.slice(0,14).map((item,i)=>{
        const poster=item.poster_path?IMG_W+item.poster_path:'';
        const title=item.title||item.name||'Untitled';
        const year=(item.release_date||item.first_air_date||'').slice(0,4);
        const type=item.media_type||'movie';
        const rate=rat(item.vote_average);
        const img=poster?`<img src="${poster}" alt="${title}" loading="lazy">`:`<div style="width:100%;height:100%;background:#222"></div>`;
        return `<div class="movie-card" style="animation-delay:${i*30}ms" onclick="openModal(${item.id},'${type}')">
          <div class="card-thumb">${img}<span class="card-rating">${rate}</span>
            <span class="card-media-badge">${type==='tv'?'TV':'Film'}</span>
            <div class="card-hover-overlay"><div class="card-play-btn"><svg viewBox="0 0 18 18"><path d="M4 2.5C4 1.67 4.9 1.16 5.6 1.6l11 6.5c.67.4.67 1.4 0 1.8l-11 6.5C4.9 16.84 4 16.33 4 15.5V2.5Z" fill="#000"/></svg></div></div>
          </div>
          <div class="card-info"><div class="card-name">${title}</div><div class="card-year">${year}</div></div>
        </div>`;
      }).join('');
    }
  }catch(e){console.error(e)}
}

function setQuery(q){
  const inp=document.getElementById('search-input');
  inp.value=q;
  document.getElementById('search-clear').classList.add('visible');
  doSearch(q);
}

async function doSearch(query){
  if(!query.trim())return;
  addRecent(query);
  const main=document.getElementById('main-area');
  const params={query,include_adult:false,page:1};
  let endpoint='/search/multi';
  if(curTab==='movie')endpoint='/search/movie';
  if(curTab==='tv')endpoint='/search/tv';

  main.innerHTML=`<div style="padding:8px 0 20px"><div class="results-header"><div class="results-title">Searching for <strong>"${query}"</strong>…</div></div>
    <div class="results-grid">
      ${Array.from({length:12},(_,i)=>`
        <div class="movie-card" style="animation-delay:${i*25}ms">
          <div class="card-thumb"><div class="skeleton" style="width:100%;aspect-ratio:2/3;border-radius:10px"></div></div>
          <div class="card-info">
            <div class="skeleton" style="height:12px;width:75%;border-radius:4px;margin-top:8px"></div>
            <div class="skeleton" style="height:10px;width:42%;border-radius:4px;margin-top:5px"></div>
          </div>
        </div>`).join('')}
    </div></div>`;

  try{
    const data=await tmdb(endpoint,params);
    let results=(data.results||[]).filter(r=>r.poster_path&&(r.media_type!=='person'));
    if(curTab==='movie')results=results.map(r=>({...r,media_type:'movie'}));
    if(curTab==='tv')results=results.map(r=>({...r,media_type:'tv'}));

    if(!results.length){
      main.innerHTML=`<div class="no-results">
        <div class="no-results-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15L21 21"/><line x1="10.5" y1="8" x2="10.5" y2="13"/><line x1="8" y1="10.5" x2="13" y2="10.5"/></svg></div>
        <div class="no-results-title">No results for "${query}"</div>
        <div class="no-results-sub">Try adjusting your search or switching between Movies and TV Shows.</div>
      </div>`;
      return;
    }

    const total=data.total_results||results.length;
    main.innerHTML=`<div style="padding:8px 0 20px">
      <div class="results-header">
        <div class="results-title"><strong>${total.toLocaleString()}</strong> results for <strong>"${query}"</strong></div>
      </div>
      <div class="results-grid">${results.slice(0,40).map((item,i)=>{
        const poster=item.poster_path?IMG_W+item.poster_path:'';
        const title=item.title||item.name||'Untitled';
        const year=(item.release_date||item.first_air_date||'').slice(0,4);
        const type=item.media_type||(item.first_air_date!==undefined?'tv':'movie');
        const rate=rat(item.vote_average);
        const img=poster?`<img src="${poster}" alt="${title}" loading="lazy">`:`<div style="width:100%;height:100%;background:#222"></div>`;
        return `<div class="movie-card" style="animation-delay:${i*22}ms" onclick="openModal(${item.id},'${type}')">
          <div class="card-thumb">${img}<span class="card-rating">${rate}</span>
            <span class="card-media-badge">${type==='tv'?'TV':'Film'}</span>
            <div class="card-hover-overlay"><div class="card-play-btn"><svg viewBox="0 0 18 18"><path d="M4 2.5C4 1.67 4.9 1.16 5.6 1.6l11 6.5c.67.4.67 1.4 0 1.8l-11 6.5C4.9 16.84 4 16.33 4 15.5V2.5Z" fill="#000"/></svg></div></div>
          </div>
          <div class="card-info"><div class="card-name">${title}</div><div class="card-year">${year}</div></div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }catch(e){console.error(e)}
}

// MODAL
function openModal(id,mediaType){
  const bd=document.getElementById('modal-backdrop'),ld=document.getElementById('modal-loading'),inn=document.getElementById('modal-inner');
  ld.style.display='flex';inn.style.display='none';inn.innerHTML='';bd.classList.add('open');document.body.style.overflow='hidden';
  const type=mediaType==='tv'?'tv':'movie';
  tmdb(`/${type}/${id}`).then(d=>{
    const title=d.title||d.name||'Untitled',year=(d.release_date||d.first_air_date||'').slice(0,4),poster=d.poster_path?IMG_ORIG+d.poster_path:'',bdUrl=d.backdrop_path?IMG_ORIG+d.backdrop_path:poster,rate=d.vote_average?(+d.vote_average).toFixed(1):'—',overview=d.overview||'No description available.',genres=(d.genres||[]).slice(0,4).map(g=>`<span class="modal-genre-chip">${g.name}</span>`).join(''),isTV=type==='tv';
    let runtime='',runtimeSecs=6120;
    if(!isTV&&d.runtime){const h=Math.floor(d.runtime/60),m=d.runtime%60;runtime=h?`${h}h ${m}m`:`${m}m`;runtimeSecs=d.runtime*60}
    else if(isTV&&d.number_of_seasons)runtime=`${d.number_of_seasons} Season${d.number_of_seasons>1?'s':''}`;
    window.__fp={title,subtitle:year+(runtime?'  ·  '+runtime:''),backdropUrl:bdUrl,runtimeSecs};
    inn.innerHTML=`<div class="modal-poster">${poster?`<img src="${poster}" alt="${title}">`:`<div style="width:100%;height:100%;background:#222"></div>`}<div class="modal-poster-grad"></div><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><div class="modal-rating-badge"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#fbbf24" stroke="#fbbf24"/></svg>${rate}</div><button class="modal-play-center" onclick="event.stopPropagation();const f=window.__fp||{};if(window.openPlayer)window.openPlayer(f.title,f.subtitle,f.backdropUrl,f.runtimeSecs);"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button><span class="modal-type-tag">${isTV?'SERIES':'FILM'}</span></div><div class="modal-body"><h2 class="modal-title">${title}</h2><div class="modal-meta-row">${year?`<span>${year}</span><span class="dot">·</span>`:''} ${runtime?`<span>${runtime}</span><span class="dot">·</span>`:''}<span style="color:rgba(255,255,255,.35);font-size:11px;text-transform:uppercase;letter-spacing:.08em">${isTV?'Series':'Movie'}</span></div><div class="modal-actions"><button class="modal-btn-play" onclick="event.stopPropagation();const f=window.__fp||{};if(window.openPlayer)window.openPlayer(f.title,f.subtitle,f.backdropUrl,f.runtimeSecs);"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play Now</button><button class="modal-btn-secondary" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Watchlist</button></div></div>${isTV?`<div class="modal-seasons-wrap"><div class="modal-seasons-label">Episodes</div><div class="modal-season-tabs" id="modal-season-tabs">${(d.seasons||[]).filter(s=>s.season_number>0).map(s=>`<button class="modal-season-tab" data-season="${s.season_number}" onclick="loadSeason(${d.id},${s.season_number})">${s.name}</button>`).join('')}</div></div><div class="modal-episodes-list" id="modal-episodes-list"><div class="modal-ep-loading">Loading episodes…</div></div>`:''}<div style="padding:0 20px 24px">${genres?`<div class="modal-genres">${genres}</div>`:''}<p class="modal-overview">${overview}</p></div>`;
    ld.style.display='none';inn.style.display='block';
    if(isTV){const seasons=(d.seasons||[]).filter(s=>s.season_number>0);if(seasons.length)loadSeason(d.id,seasons[seasons.length-1].season_number)}
  }).catch(()=>{inn.innerHTML=`<div style="padding:40px;text-align:center;color:var(--muted)">Failed to load.</div>`;ld.style.display='none';inn.style.display='block'});
}

async function loadSeason(sid,snum){
  document.querySelectorAll('.modal-season-tab').forEach(b=>b.classList.toggle('active',+b.dataset.season===snum));
  const list=document.getElementById('modal-episodes-list');if(!list)return;
  list.innerHTML=`<div class="modal-ep-loading">Loading…</div>`;
  try{
    const data=await tmdb(`/tv/${sid}/season/${snum}`);const eps=data.episodes||[];
    if(!eps.length){list.innerHTML=`<div class="modal-ep-loading">No episodes.</div>`;return}
    list.innerHTML=eps.map(ep=>{const thumb=ep.still_path?`https://image.tmdb.org/t/p/w300${ep.still_path}`:null,showBd=(window.__fp&&window.__fp.backdropUrl)?window.__fp.backdropUrl.replace('/original/','/w300/'):'',rt=ep.runtime?`${ep.runtime}m`:'',ad=(ep.air_date||'').slice(0,4),meta=[rt,ad].filter(Boolean).join(' · ');
      return `<button class="modal-episode" onclick="event.stopPropagation();openEpisode(${snum},${ep.episode_number},'${(ep.name||'Episode '+ep.episode_number).replace(/'/g,"\\'")}',${ep.runtime?ep.runtime*60:2700})"><div class="modal-ep-thumb">${thumb?`<img src="${thumb}" loading="lazy">`:showBd?`<img class="ep-thumb-fallback" src="${showBd}" loading="lazy">`:`<div class="modal-ep-thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/></svg></div>`}<div class="modal-ep-play-overlay"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><span class="modal-ep-num">E${ep.episode_number}</span></div><div class="modal-ep-info"><div class="modal-ep-title">${ep.name||'Episode '+ep.episode_number}</div>${meta?`<div class="modal-ep-meta">${meta}</div>`:''} ${ep.overview?`<div class="modal-ep-desc">${ep.overview}</div>`:''}</div></button>`;
    }).join('');
  }catch{list.innerHTML=`<div class="modal-ep-loading">Failed to load.</div>`}
}

function closeModal(e){if(e&&e.target!==document.getElementById('modal-backdrop'))return;document.getElementById('modal-backdrop').classList.remove('open');document.body.style.overflow=''}
function openEpisode(sn,en,name,rs){const f=window.__fp||{};document.getElementById('modal-backdrop').classList.remove('open');document.body.style.overflow='';if(window.openPlayer)window.openPlayer(f.title||'',`S${sn}  ·  E${en}  ·  ${name}`,f.backdropUrl||'',rs)}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('fp-overlay').classList.contains('open')){window.closePlayer&&window.closePlayer();return}const bd=document.getElementById('modal-backdrop');if(bd.classList.contains('open')){bd.classList.remove('open');document.body.style.overflow=''}}
});

// Initial state
showEmptyState();

// PLAYER
(function(){
  const ov=document.getElementById('fp-overlay'),bg=document.getElementById('fp-bg'),ti=document.getElementById('fp-title'),su=document.getElementById('fp-sub'),pb=document.getElementById('fp-play'),pi=document.getElementById('fp-play-icon'),rw=document.getElementById('fp-rew'),fw=document.getElementById('fp-fwd'),pr=document.getElementById('fp-prog'),fi=document.getElementById('fp-fill'),bu=document.getElementById('fp-buf'),dt=document.getElementById('fp-dot'),tp=document.getElementById('fp-tip'),tm=document.getElementById('fp-time'),mu=document.getElementById('fp-mute'),vi=document.getElementById('fp-vol-icon'),vs=document.getElementById('fp-vol'),fs=document.getElementById('fp-fs'),cb=document.getElementById('fp-close'),tl=document.getElementById('fp-tap-l'),tr=document.getElementById('fp-tap-r'),rl=document.getElementById('fp-rip-l'),rr=document.getElementById('fp-rip-r'),ui=document.getElementById('fp-ui'),ce=document.getElementById('fp-center'),bo=document.getElementById('fp-bottom');
  let dur=6120,cur=0,play=false,raf=null,lts=null,ht=null,drag=false,bp=0,bt=0;
  const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`:`${m}:${String(sc).padStart(2,'0')}`};
  function setP(v){play=v;pi.innerHTML=play?'<rect x="6" y="4" width="4" height="16" fill="#fff"/><rect x="14" y="4" width="4" height="16" fill="#fff"/>':'<polygon points="5 3 19 12 5 21 5 3" fill="#fff"/>';if(play){lts=null;raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)}
  function tick(ts){if(!play)return;if(lts!==null){const d=(ts-lts)/1000;cur=Math.min(dur,cur+d);bt=Math.min(100,(cur/dur)*100+18+Math.random()*2);bp+=(bt-bp)*.04}lts=ts;if(!drag)upUI();if(cur>=dur){cur=dur;setP(false);upUI();return}raf=requestAnimationFrame(tick)}
  function upUI(){const p=dur?(cur/dur)*100:0;fi.style.width=p+'%';dt.style.left=p+'%';bu.style.width=bp+'%';tm.textContent=fmt(cur)+' / '+fmt(dur)}
  function showUI(){ui.style.opacity=ce.style.opacity=bo.style.opacity='1';ui.style.pointerEvents=ce.style.pointerEvents=bo.style.pointerEvents='';clearTimeout(ht);if(play)ht=setTimeout(hideUI,3200)}
  function hideUI(){ui.style.opacity=ce.style.opacity=bo.style.opacity='0';ui.style.pointerEvents=ce.style.pointerEvents=bo.style.pointerEvents='none'}
  ov.addEventListener('mousemove',showUI);ov.addEventListener('touchstart',showUI,{passive:true});
  ov.addEventListener('click',e=>{if(e.target===ov||e.target===bg){showUI();if(play)hideUI()}});
  pb.addEventListener('click',()=>{setP(!play);showUI()});
  rw.addEventListener('click',()=>{cur=Math.max(0,cur-10);upUI();showUI()});
  fw.addEventListener('click',()=>{cur=Math.min(dur,cur+10);upUI();showUI()});
  function frac(e){const r=pr.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX;return Math.max(0,Math.min(1,(cx-r.left)/r.width))}
  function seek(f){cur=f*dur;upUI()}
  pr.addEventListener('mousedown',e=>{drag=true;seek(frac(e))});
  pr.addEventListener('touchstart',e=>{drag=true;seek(frac(e))},{passive:true});
  pr.addEventListener('mousemove',e=>{const f=frac(e);tp.textContent=fmt(f*dur);tp.style.left=(f*100)+'%';if(drag)seek(f)});
  window.addEventListener('mousemove',e=>{if(drag)seek(frac(e))});
  window.addEventListener('mouseup',()=>{drag=false});window.addEventListener('touchend',()=>{drag=false});
  mu.addEventListener('click',()=>{const m=vi.innerHTML.includes('M15');vi.innerHTML=m?'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>':'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';showUI()});
  vs.addEventListener('input',()=>showUI());
  fs.addEventListener('click',()=>{const el=document.getElementById('fp-overlay');if(!document.fullscreenElement&&!document.webkitFullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else(document.exitFullscreen||document.webkitExitFullscreen).call(document)});
  function dtap(zone,ripple,dir){let taps=0,timer=null;zone.addEventListener('touchend',()=>{taps++;if(taps===1){timer=setTimeout(()=>{taps=0;setP(!play);showUI()},240)}else{clearTimeout(timer);taps=0;cur=Math.max(0,Math.min(dur,cur+(dir==='r'?10:-10)));upUI();ripple.classList.add('show');setTimeout(()=>ripple.classList.remove('show'),500)}})}
  dtap(tl,rl,'l');dtap(tr,rr,'r');
  document.addEventListener('keydown',e=>{if(!ov.classList.contains('open'))return;if(e.target.tagName==='INPUT')return;switch(e.key){case' ':case'k':e.preventDefault();setP(!play);showUI();break;case'ArrowLeft':e.preventDefault();cur=Math.max(0,cur-10);upUI();showUI();break;case'ArrowRight':e.preventDefault();cur=Math.min(dur,cur+10);upUI();showUI();break;case'm':case'M':mu.click();break;case'f':case'F':fs.click();break}});
  cb.addEventListener('click',window.closePlayer=function(){setP(false);cur=0;bp=0;ov.classList.remove('open');document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})});
  window.openPlayer=function(title,subtitle,bdUrl,d){dur=d||6120;cur=0;bp=0;bt=0;ti.textContent=title||'';su.textContent=subtitle||'';bg.style.backgroundImage=bdUrl?`url(${bdUrl})`:'none';ov.classList.add('open');document.body.style.overflow='hidden';upUI();showUI();setTimeout(()=>setP(true),300)};
})();
</script>
</body>
